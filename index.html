<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab UBG</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 10px 8px 30px;
  background: #090a27;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
}

.header {
  max-width: 1900px;
  margin: 0 auto 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}

.logo {
  font-size: 28px;
  font-weight: 900;
}

.search {
  width: min(330px, 45vw);
  padding: 12px 16px;
  border: 0;
  outline: 0;
  border-radius: 18px;
  background: #171838;
  color: white;
  font-size: 15px;
}

.search::placeholder {
  color: #aaaac2;
}

.games {
  width: 100%;
  max-width: 1900px;
  margin: auto;
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 32px;
}

.game {
  display: block;
  position: relative;
  aspect-ratio: 1;
  overflow: hidden;
  border-radius: 20px;
  background: #15162f;
  text-decoration: none;
  box-shadow: 0 4px 14px rgba(0,0,0,.18);
  transition: transform .16s ease, box-shadow .16s ease;
}

.game:hover {
  transform: translateY(-5px) scale(1.025);
  box-shadow: 0 10px 28px rgba(0,0,0,.35);
}

.game img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}

.game-name {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 35px 10px 10px;
  color: white;
  font-size: 16px;
  font-weight: 800;
  background: linear-gradient(
    transparent,
    rgba(0,0,0,.82)
  );
  opacity: 0;
  transition: opacity .15s ease;
}

.game:hover .game-name {
  opacity: 1;
}

.ad {
  grid-column: 1 / -1;
  min-height: 90px;
  border-radius: 14px;
  background: rgba(255,255,255,.025);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #66677e;
  font-size: 11px;
}

/* Large screens */
@media (max-width: 1499px) {
  .games {
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 26px;
  }
}

/* Tablets */
@media (max-width: 1049px) {
  .games {
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 20px;
  }
}

/* Phones */
@media (max-width: 699px) {
  .header {
    flex-direction: column;
    align-items: stretch;
  }

  .logo {
    text-align: center;
  }

  .search {
    width: 100%;
  }

  .games {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
  }

  .game {
    border-radius: 13px;
  }

  .game-name {
    display: none;
  }
}

@media (max-width: 430px) {
  .games {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">Game Hub</div>

  <input
    id="search"
    class="search"
    type="search"
    placeholder="Search games..."
  >
</header>

<main class="games">

  <a class="game" href="game1.html">
    <img src="images/game1.jpg" alt="Game 1">
    <span class="game-name">Game 1</span>
  </a>

  <a class="game" href="game2.html">
    <img src="images/game2.jpg" alt="Game 2">
    <span class="game-name">Game 2</span>
  </a>

  <a class="game" href="game3.html">
    <img src="images/game3.jpg" alt="Game 3">
    <span class="game-name">Game 3</span>
  </a>

  <a class="game" href="game4.html">
    <img src="images/game4.jpg" alt="Game 4">
    <span class="game-name">Game 4</span>
  </a>

  <a class="game" href="game5.html">
    <img src="images/game5.jpg" alt="Game 5">
    <span class="game-name">Game 5</span>
  </a>

  <a class="game" href="game6.html">
    <img src="images/game6.jpg" alt="Game 6">
    <span class="game-name">Game 6</span>
  </a>

  <a class="game" href="game7.html">
    <img src="images/game7.jpg" alt="Game 7">
    <span class="game-name">Game 7</span>
  </a>

  <a class="game" href="game8.html">
    <img src="images/game8.png" alt="Game 8">
    <span class="game-name">Game 8</span>
  </a>

  <a class="game" href="game9.html">
    <img src="images/game9.jpg" alt="Game 9">
    <span class="game-name">Game 9</span>
  </a>

  <a class="game" href="game10.html">
    <img src="images/game10.jpg" alt="Game 10">
    <span class="game-name">Game 10</span>
  </a>

  <div class="ad">
    ADVERTISEMENT
  </div>

</main>

<script>
const search = document.getElementById("search");
const games = [...document.querySelectorAll(".game")];

search.addEventListener("input", () => {
  const query = search.value.toLowerCase().trim();

  games.forEach(game => {
    const name = game
      .querySelector(".game-name")
      .textContent
      .toLowerCase();

    game.style.display = name.includes(query) ? "" : "none";
  });
});
</script>

</body>
</html>
