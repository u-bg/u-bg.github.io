<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Games</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0d1020;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 25px;
      text-align: center;
      background: #151a33;
      border-bottom: 2px solid #252b50;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 32px;
    }

    #search {
      width: 90%;
      max-width: 500px;
      padding: 13px 18px;
      border: none;
      border-radius: 10px;
      outline: none;
      background: #242a49;
      color: white;
      font-size: 16px;
    }

    #search::placeholder {
      color: #aaa;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      padding: 30px;
      max-width: 1400px;
      margin: auto;
    }

    .game {
      text-decoration: none;
      color: white;
      background: #171c36;
      border-radius: 14px;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid #252b50;
    }

    .game:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    }

    .game img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
    }

    .game-name {
      padding: 13px;
      text-align: center;
      font-weight: bold;
      font-size: 16px;
    }

    @media (max-width: 500px) {
      .games {
        grid-template-columns: repeat(2, 1fr);
        padding: 15px;
        gap: 12px;
      }
    }
  </style>
</head>

<script>
  function searchGames() {
    const input = document.getElementById("search").value.toLowerCase();
    const games = document.querySelectorAll(".game");

    games.forEach(game => {
      const name = game.querySelector(".game-name").textContent.toLowerCase();

      if (name.includes(input)) {
        game.style.display = "";
      } else {
        game.style.display = "none";
      }
    });
  }
</script>
