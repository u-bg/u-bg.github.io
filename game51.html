<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    .game {
      width: 100vw;
      height: 100vh;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="game">
    <iframe
      src="https://scratch.mit.edu/projects/1024979122/embed"
      title="Game"
      allowfullscreen
      allow="autoplay; fullscreen"
      scrolling="no">
    </iframe>
  </div>
</body>
</html>
